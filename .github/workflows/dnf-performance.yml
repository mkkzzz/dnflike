name: DNF performance guard
on:
  push:
    paths:
      - 'game_dnf/**'
      - 'tools/**'
      - '.github/workflows/dnf-performance.yml'
  pull_request:
    paths:
      - 'game_dnf/**'
      - 'tools/**'
      - '.github/workflows/dnf-performance.yml'
permissions:
  contents: read
jobs:
  static-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the guard rejects regression fixtures
        run: python3 tools/test_check_dnf_performance.py
      - name: Reject runtime catalog copies and skill tree rebuilds
        run: python3 tools/check_dnf_performance.py
      - name: Check skill data regressions (not original fidelity sign-off)
        run: python3 tools/test_dnf_skill_runtime.py
      - name: Preserve archive CRC checks when decoding the client directory
        run: python3 tools/test_dnf_pvf_archive.py
      - name: Verify native string decoder with original byte fixtures
        run: python3 tools/test_dnf_native_strings.py
      - name: Preserve native particle axes and ordered source parameters
        run: |
          python3 tools/test_dnf_pvf.py
          python3 tools/test_dnf_particles.py
          python3 tools/test_dnf_particle_axis.py
          python3 tools/test_dnf_particle_random.py
          python3 tools/test_dnf_ice_particle_bindings.py
          python3 tools/test_dnf_ice_shatter.py
          python3 tools/test_dnf_firewave.py
          python3 tools/test_dnf_fixed_attack.py
          python3 tools/test_dnf_fixed_base.py
          python3 tools/test_dnf_fixed_table_loader.py
          python3 tools/test_dnf_level_normalization.py
          python3 tools/test_dnf_revision_table.py
          python3 tools/test_dnf_revision_dispatch.py
          python3 tools/test_dnf_skill_value.py
          python3 tools/test_dnf_skill_modifier.py
      - name: Check quest semantics and portable package verification
        run: python3 tools/test_dnf_quest_rules.py
      - name: Inventory skill binding evidence gaps
        run: python3 tools/audit_dnf_skill_fidelity.py
