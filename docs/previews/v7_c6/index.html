<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>鬼剑士 c6 动作返修预览</title>
<style>body{margin:24px;background:#171c24;color:#e5e9ef;font:16px system-ui}main{max-width:1440px;margin:auto}video{display:block;width:100%;background:#252c35;border-radius:8px;margin:18px 0}select,button{font:inherit;padding:8px;margin-right:8px}p{color:#b8c5d7;line-height:1.6}</style>
<main><h2>鬼剑士 c6 历史候选 / 部分退回</h2><p>用户已认可 idle 与采样流畅度；行走、奔跑和三连的动作设计已退回。离线片段为原生 2K；旧引擎连续录像实际 1080p，已纠正原命名。默认半速；力量感请同时看 1×。不含技能。</p>
<select id="clip"></select><select id="speed"><option value="0.25">0.25×</option><option value="0.5" selected>0.5×</option><option value="1">1×</option></select><button id="previous">上一帧</button><button id="next">下一帧</button><video id="video" controls loop playsinline></video><p>上一帧/下一帧按源文件 60Hz 逐帧查看。游戏视频含真实操作与恢复过渡，离线视频只显示各片段自身。</p></main>
<script>const names=["attack1", "walk", "walk_start", "walk_stop", "run", "run_start", "run_stop", "idle", "attack2", "attack3", "dash_attack", "air_attack", "guard_start", "guard", "guard_recoil", "parry", "guard_end", "turn", "jump_start", "jump_rise", "jump_apex", "jump_fall", "jump_land", "jump", "back_dash", "hit_light", "hit_heavy", "air_hit", "down", "getup", "death", "revive"];const clip=document.querySelector('#clip'),video=document.querySelector('#video'),speed=document.querySelector('#speed');for(const name of names){const option=document.createElement('option');option.value=name+'_60fps.mp4';option.textContent=name;clip.append(option)}
const game=document.createElement('option');game.value='gameplay_1080p.mp4';game.textContent='旧游戏连续操作（实机1080p，动作已退回）';clip.append(game);function load(){video.src=clip.value;video.playbackRate=Number(speed.value);video.play().catch(()=>{})}clip.onchange=load;speed.onchange=()=>video.playbackRate=Number(speed.value);for(const [id,d]of[['previous',-1],['next',1]])document.querySelector('#'+id).onclick=()=>{video.pause();video.currentTime=Math.max(0,video.currentTime+d/60)};load();</script></html>
