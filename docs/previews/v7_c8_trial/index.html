<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>鬼剑士 c8 第一刀试用</title>
<style>body{margin:24px;background:#171c24;color:#e5e9ef;font:16px system-ui}main{max-width:1440px;margin:auto}video{display:block;width:100%;background:#252c35;border-radius:8px;margin:18px 0}select,button{font:inherit;padding:8px;margin-right:8px}p{color:#b8c5d7;line-height:1.6}</style>
<main><h2>鬼剑士 c8 第一刀试用</h2><p>用户已认可新三姿势的发力方向。此片段使用同一身体/手指层切换太刀、巨剑、短剑，保留原30tick时长；已接入 P 面板“新第一刀试用”，默认仍用现版。原生2K、无刀光，默认半速；请同时看实速。G1通过不代表完整动作或G3获认可。</p>
<select id="clip"></select><select id="speed"><option value="0.25">0.25×</option><option value="0.5" selected>0.5×</option><option value="1">1×</option></select><button id="previous">上一帧</button><button id="next">下一帧</button><video id="video" controls loop playsinline></video><p>上一帧/下一帧按源文件 60Hz 逐帧查看。实机视频由真实 GM 命令与攻击输入录制。离线 attack1 直接消费同一试用包。其余两刀和新步态仍在制作；仅第一刀已接入试用，完整动作质量尚待验收。</p></main>
<script>const names=["attack1"];const clip=document.querySelector('#clip'),video=document.querySelector('#video'),speed=document.querySelector('#speed');for(const name of names){const option=document.createElement('option');option.value=name+'_60fps.mp4';option.textContent=name;clip.append(option)}
const game=document.createElement('option');game.value='gameplay_1080p.mp4';game.textContent='旧游戏连续操作（实机1080p，动作已退回）';const live=document.createElement('option');live.value='first_cut_native_2k.mp4';live.textContent='实机：三武器 × 左右朝向（原生2K）';clip.prepend(live);clip.value=live.value;function load(){video.src=clip.value;video.playbackRate=Number(speed.value);video.play().catch(()=>{})}clip.onchange=load;speed.onchange=()=>video.playbackRate=Number(speed.value);for(const [id,d]of[['previous',-1],['next',1]])document.querySelector('#'+id).onclick=()=>{video.pause();video.currentTime=Math.max(0,video.currentTime+d/60)};load();</script></html>
